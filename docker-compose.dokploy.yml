# Dokploy deployment: named data volume and env vars from Dokploy instead of
# the ./backend/data bind mount and backend/.env used by docker-compose.yml
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: kids-routine-backend:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      GIPHY_QUERY: ${GIPHY_QUERY:-high five}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_APPROACH_MINUTES: ${WEBHOOK_APPROACH_MINUTES:-}
    volumes:
      - backend-data:/app/backend/data
    expose:
      - "3001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: kids-routine-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  backend-data:
